server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve precompressed .gz assets when present (vite-plugin-compression2)
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health endpoint for the container/Traefik healthcheck
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Hashed, immutable build assets — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3D models — correct mime + medium cache
    location /models/ {
        types { model/gltf-binary glb; }
        default_type model/gltf-binary;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Static media (renders, gallery, video)
    location ~* \.(jpg|jpeg|png|webp|gif|svg|mp4|webm|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SSG: prerendered routes (/, /produs/punct-de-paza) + SPA fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Don't cache the entry HTML so deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
