server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Health endpoint must stay green so Traefik keeps routing to us
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Everything else -> 503 with the maintenance page (good for SEO: temporary)
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 503;
    }
}
