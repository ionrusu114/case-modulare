name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ionrusu114/case-modulare:latest
            ionrusu114/case-modulare:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH (Traefik / docker compose)
        uses: appleboy/ssh-action@v1.2.0
        env:
          # ACTIVE secret: false -> maintenance page, anything else (incl. unset) -> live site
          ACTIVE: ${{ secrets.ACTIVE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ACTIVE
          script: |
            cd /root/docker/composes/spacebox
            printf 'ACTIVE=%s\n' "${ACTIVE:-true}" > .env
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
