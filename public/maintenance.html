<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>SpaceBox — Pagina indisponibilă momentan</title>
  <style>
    :root {
      --ink: #1c1b18;
      --ink-2: #262420;
      --cloud: #f6f5f2;
      --slate: #9a958c;
      --ember: #f0a868;
      --line: rgba(246, 245, 242, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(120% 80% at 50% 0%, var(--ink-2) 0%, var(--ink) 60%);
      color: var(--cloud);
      font-family: 'Space Grotesk', 'Sora', ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    .card { max-width: 34rem; }
    .logo {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cloud);
    }
    .dot { color: var(--ember); }
    .badge {
      display: inline-block;
      margin: 2.5rem 0 1.25rem;
      padding: 0.35rem 0.85rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ember);
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      font-weight: 600;
      line-height: 1.15;
    }
    p {
      margin: 0 auto;
      max-width: 26rem;
      color: var(--slate);
      font-size: 1.02rem;
      line-height: 1.6;
    }
    .meta {
      margin-top: 2.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--slate);
    }
    .meta a { color: var(--cloud); text-decoration: none; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Space<span class="dot">Box</span></div>
    <span class="badge">Mentenanță</span>
    <h1>Pagina indisponibilă momentan</h1>
    <p>Lucrăm la îmbunătățiri și revenim în scurt timp. Îți mulțumim pentru răbdare.</p>
    <div class="meta">
      Pentru oferte și informații: <a href="mailto:contact@spacebox.md">contact@spacebox.md</a>
    </div>
  </main>
</body>
</html>
